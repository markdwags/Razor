name: Build Site

# Pull requests only build the site; pushes to main also deploy it.

on:
  push:
    branches:
      - main
    paths:
    - 'help/**'
    - '**/build-site.yml'
  pull_request:
    branches:
      - main
    paths:
    - 'help/**'
    - '**/build-site.yml'

concurrency:
  group: site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./help

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-revision-date-localized needs history for page dates

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: help/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
          pip install -r requirements.txt

      - name: Install and modify Pygments
        run: |
          git clone --depth 1 --branch 2.21.0 https://github.com/pygments/pygments.git

          # Register the Razor lexer alongside the built-in ones
          sed -i "/^LEXERS = {/a\    'RazorLexer': ('pygments.lexers.razor', 'RazorL', ('razor',), ('*.razor',), ('text/x-razor',))," ./pygments/pygments/lexers/_mapping.py
          grep -q "'RazorLexer'" ./pygments/pygments/lexers/_mapping.py

          cp pygments.lexers.razor ./pygments/pygments/lexers/razor.py
          cp pygments.styles.razor ./pygments/pygments/styles/razor.py

          pip install -e ./pygments/

      - name: Cache social cards
        uses: actions/cache@v6
        with:
          path: help/.cache
          key: social-${{ hashFiles('help/docs/**', 'help/mkdocs.yml', 'help/overrides/**') }}
          restore-keys: social-

      - name: Build site
        run: mkdocs build

      - name: Generate robots.txt
        if: github.event_name == 'push'
        run: |
          cat > ./site/robots.txt <<EOF
          User-agent: *
          Allow: /

          Sitemap: https://www.razorce.com/sitemap.xml
          EOF

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Deploy static site to S3 bucket
        if: github.event_name == 'push'
        run: aws s3 sync ./site s3://www.razorce.com

      - name: Create CloudFront Invalidation
        if: github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_A }} --paths "/*"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_B }} --paths "/*"

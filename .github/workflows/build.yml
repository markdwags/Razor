name: Build & Release

# push to main      -> builds Major.Minor.<run_number>.0 and replaces the "Razor Dev Preview" pre-release
# Run workflow      -> builds Major.Minor.<run_number>.0 and creates a draft release tagged v<version>
#
# Both share this workflow's run number, so dev previews and releases use one version sequence.
# Bump Major.Minor in Razor/Properties/AssemblyInfo.cs when starting a new minor version.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'help/**'
      - '**/build-site.yml'
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-razor.yml
    with:
      build-number: ${{ github.run_number }}
      package: ${{ github.event_name == 'workflow_dispatch' && 'release' || 'dev' }}

  dev-preview:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: razor-dev
        path: dist

    - name: Replace dev preview release
      run: |
        gh release delete Razor-dev-preview --cleanup-tag --yes || true
        gh release create Razor-dev-preview dist/*.zip \
          --prerelease \
          --target "$GITHUB_SHA" \
          --title "Razor Dev Preview" \
          --notes "This is built automatically after each commit to main, so it may contain bugs and/or unfinished features but is generally considered stable. Use at your own risk.

        Version ${VERSION}, built from ${GITHUB_SHA}."

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
    - name: Check branch
      if: github.ref != 'refs/heads/main'
      run: |
        echo "::error::Releases can only be created from main (this run is on ${GITHUB_REF})."
        exit 1

    - name: Check tag is unused
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "::error::A release named $TAG already exists."
          exit 1
        fi

    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: razor-release
        path: dist

    - name: Create draft release
      run: |
        gh release create "$TAG" dist/*.zip \
          --draft \
          --generate-notes \
          --target "$GITHUB_SHA" \
          --title "Razor $TAG"
        echo "Draft release $TAG created. Edit the notes and publish it from the Releases page." >> "$GITHUB_STEP_SUMMARY"

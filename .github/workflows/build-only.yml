name: Build Only

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'help/**'
      - '**/build-site.yml'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-razor.yml
    with:
      package: none
